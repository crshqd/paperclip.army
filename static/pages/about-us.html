<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.upset.dev">
    <link href="https://fonts.upset.dev/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            text-align: center;
            font-family: "Ubuntu", sans-serif;
            font-weight: 400;
            font-style: normal;
            color: white;
        }

        button {
            font-size: 1.5em;
            margin-top: 50px;
            transition: transform 0.1s ease;
            font-family: "Ubuntu", sans-serif;
            background: #1c1c1c;
            border: 3px solid #797979;
            border-radius: 18px;
            padding: 10px;
            color: white;
        }
        button.noborder {
            margin: 0;
            padding: 0;
            border: 0;
            background: transparent;
        }
        #filters > button {
            margin-top: 0;
            font-size: 1em;
        }

        button:active:not(:disabled) {
            transform: scale(0.9);
        }

        button:disabled {
            color: #999999;

        }

        .searchbar {
            width: 300px;
            margin-inline: auto;
            background: #1c1c1c;
            border: 4px solid #333;
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 6px 16px;
            box-sizing: border-box;
        }

        .searchbar>button {
            margin-top: 0;
            border: 0;
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 0.9em;
            padding: 0;
            padding-left: 10px;
            transition: transform 0.1s ease;
            flex-shrink: 0;
        }

        .searchbar>input {
            border: 0;
            background: transparent;
            color: white;
            font-family: "Ubuntu", sans-serif;
            font-weight: 400;
            font-style: normal;
            width: 100%;
            margin: 0;
            padding: 8px 0;
        }

        .searchbar>input:focus {
            outline: none;
        }

        .searchbar>button:active {
            transform: scale(0.9);
        }

        .searchbar>input::placeholder {
            /* use mask font for when we get fonts in here */
        }

        #entrybox {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .entry {
            width: 220px;
            background: #1c1c1c;
            border-radius: 14px;
            overflow: hidden;
        }

        .entry>img {
            width: 100%;
            height: 310px;
            object-fit: cover;
            display: block;
        }

        .below {
            padding: 12px;
            background: #1c1c1c;
            width: auto;
        }

        .title {
            font-size: 1.25em;
            font-weight: 700;
        }

        .meta {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            color: #aaa;
            font-size: 0.9em;
            margin-inline: auto;
        }

        .description {
            color: #bbb;
            font-size: 0.9em;
            line-height: 1.4;
            margin: 10px 0;
        }

        .watch {
            width: 100%;
            margin-top: 5px;
            font-size: 1em;
        }
        .padding {
            margin-bottom: 100px;
            color: transparent;
            user-select: none;
        }
        #iframe {
            width: 80vw;
            height: 80vh;

            background: rgba(17, 17, 17, 0.865);
            position: fixed;
            top: 4vh;
            left: 10vw;
            border-radius: 30px;

            display: flex;
            flex-direction: column;
        }

        #closeiframe {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;
            border: 0;
            color: white;
            cursor: pointer;
        }
        select {
            background: transparent;
            border: 0;
            color: white;
            font-family: "Ubuntu", sans-serif;
            font-size: 1em;
        }
        option {
            color: black;
        }
        #iframe2 {
            width: 80vw;
            flex: 1;
            min-height: 0;

            padding: 0;
            margin: 0;
            border: 0;
        }
    </style>
</head>

<body>
    <button onclick="m()">movies</button>
    <button onclick="t()">tv shows</button>
    <button onclick="a()">anime</button>
    <button onclick="l()" disabled aria-disabled="true">live channels</button>
    <button disabled aria-disabled="true">youtube</button>
    <div class="tv"><br>
        <div class="searchbar">
            <input type="text" id="searchmedia" placeholder="Search media..." />
            <button onclick="search()"><i data-lucide="search"></i></button>
        </div><br>
        <div id="filters">
            <button onclick="mt()">Trending</button>
            <button onclick="mp()">Popular</button>
            <button onclick="mr()">Recent</button>
        </div><br><br>
        <div id="entrybox">
            Loading...
        </div><br>
        <div class="pagination">
            <button onclick="prev()" class="noborder" id="prev" disabled><i data-lucide="ChevronLeft" onclick="prev()"></i></button> 
            <span id="page"> Page 1/1 </span>
            <button onclick="next()" class="noborder" id="next" disabled><i data-lucide="ChevronRight" onclick="prev()"></i></button> 
        </div>
    </div>
    <div id="iframe" style="display:none;">
        <button id="closeiframe" onclick="closee()"><i data-lucide="x"></i></button>
        <h1 id="medianame">Name</h1>
        <div id="seasepis">
            <select id="season">
                <option value="none">Choose a season</option>
                <hr>
            </select>
            <select id="episode">
                <option value="none">Choose an episode</option>
                <hr>
            </select>
            <select id="subdub">
                <option value="sub">Subtitles</option>
                <option value="dub">Dubbing</option>
            </select>
        </div><br>
        <iframe id="iframe2" frameBorder="0" scrolling="no" allowFullScreen></iframe>
    </div>
    <div class="live nosee"></div>
    <div class="padding">secret message :P</div>
    <script src="/lib/lucide.js"></script>
    <script src="../js/about-us.js"></script>
</body>

</html>
